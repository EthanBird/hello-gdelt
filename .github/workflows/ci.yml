name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src/hello_gdelt
      - run: pytest --cov=hello_gdelt --cov-report=term-missing --cov-fail-under=65
      - run: python -m build
      - run: hello-gdelt hypothesis demo --registry /tmp/hypothesis.sqlite --report /tmp/report.md

  attention-study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e . matplotlib --quiet
      - name: Run preregistered GDELT-Wikipedia study
        id: study
        continue-on-error: true
        env:
          MPLBACKEND: Agg
          RESEARCH_OUTPUT: research_output
        run: |
          mkdir -p research_output
          set +e
          python research/gdelt_wikipedia_attention/run_study_quality_filtered.py > research_output/run.log 2>&1
          status=$?
          echo "$status" > research_output/exit_code.txt
          cat research_output/run.log
          exit 0
      - name: Upload reproducibility and diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-wikipedia-attention-study
          path: research_output/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce research success
        if: always()
        run: |
          test -f research_output/exit_code.txt
          test "$(cat research_output/exit_code.txt)" = "0"
          test -s research_output/results.json
          test -s research_output/analysis_panel.csv
