name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src/hello_gdelt
      - run: pytest --cov=hello_gdelt --cov-report=term-missing --cov-fail-under=65
      - run: python -m build
      - run: hello-gdelt hypothesis demo --registry /tmp/hypothesis.sqlite --report /tmp/report.md

  attention-study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . matplotlib
      - name: Run preregistered GDELT-Wikipedia study
        env:
          MPLBACKEND: Agg
          RESEARCH_OUTPUT: research_output
        run: python research/gdelt_wikipedia_attention/run_study.py
      - name: Print primary decisions
        run: python -m json.tool research_output/results.json | head -n 180
      - name: Upload reproducibility bundle
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-wikipedia-attention-study
          path: research_output/
          if-no-files-found: error
          retention-days: 30
