name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

concurrency:
  group: hello-gdelt-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run Ruff and preserve diagnostics
        continue-on-error: true
        run: |
          set +e
          ruff check src tests --output-format=concise > ruff-report.txt 2>&1
          status=$?
          cat ruff-report.txt
          echo "$status" > ruff-exit-code.txt
          exit 0
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics-${{ matrix.python-version }}
          path: |
            ruff-report.txt
            ruff-exit-code.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Ruff gate
        run: test "$(cat ruff-exit-code.txt)" = "0"
      - run: mypy src/hello_gdelt
      - run: pytest --cov=hello_gdelt --cov-report=term-missing --cov-fail-under=65
      - run: python -m build
      - run: hello-gdelt hypothesis demo --registry /tmp/hypothesis.sqlite --report /tmp/report.md
