name: CI

on:
  push:
    branches: [main, "agent/**", "research/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "research/global_news_markets/run_raw_event_pilot.py"
      - "research/global_news_markets/run_raw_event_pilot_v2.py"
      - "research/global_news_markets/raw_event_pilot_protocol.md"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "research/global_news_markets/run_raw_event_pilot.py"
      - "research/global_news_markets/run_raw_event_pilot_v2.py"
      - "research/global_news_markets/raw_event_pilot_protocol.md"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src/hello_gdelt
      - run: pytest --cov=hello_gdelt --cov-report=term-missing --cov-fail-under=65
      - run: python -m build
      - run: hello-gdelt hypothesis demo --registry /tmp/hypothesis.sqlite --report /tmp/report.md

  raw-event-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install raw Event dependencies
        run: python -m pip install pandas pyarrow --quiet
      - name: Download and validate 14 official GDELT Event days
        id: raw_event
        continue-on-error: true
        run: |
          mkdir -p raw_event_output
          set +e
          python research/global_news_markets/run_raw_event_pilot_v2.py \
            --start 2025-07-18 --end 2025-07-31 \
            --output raw_event_output > raw_event_output/run.log 2>&1
          status=$?
          echo "$status" > raw_event_output/exit_code.txt
          cat raw_event_output/run.log
          exit 0
      - name: Upload raw Event evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-daily-event-raw-pilot
          path: raw_event_output/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce raw Event data gates
        if: always()
        run: |
          test -f raw_event_output/exit_code.txt
          test "$(cat raw_event_output/exit_code.txt)" = "0"
          test -s raw_event_output/manifest.json
          test -s raw_event_output/global_day_state.parquet
          test -s raw_event_output/country_day_state.parquet
          test -s raw_event_output/bilateral_day_relation.parquet
