name: CI

on:
  push:
    branches: [main, "agent/**", "research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src/hello_gdelt
      - run: pytest --cov=hello_gdelt --cov-report=term-missing --cov-fail-under=65
      - run: python -m build
      - run: hello-gdelt hypothesis demo --registry /tmp/hypothesis.sqlite --report /tmp/report.md

  attention-study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e . matplotlib --quiet
      - name: Run preregistered GDELT-Wikipedia study
        id: study
        continue-on-error: true
        env:
          MPLBACKEND: Agg
          RESEARCH_OUTPUT: research_output
        run: |
          mkdir -p research_output
          set +e
          python research/gdelt_wikipedia_attention/run_study_quality_filtered.py > research_output/run.log 2>&1
          status=$?
          echo "$status" > research_output/exit_code.txt
          cat research_output/run.log
          exit 0
      - name: Upload reproducibility and diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-wikipedia-attention-study
          path: research_output/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce research success
        if: always()
        run: |
          test -f research_output/exit_code.txt
          test "$(cat research_output/exit_code.txt)" = "0"
          test -s research_output/results.json
          test -s research_output/analysis_panel.csv

  market-study-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install market research dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e . pandas statsmodels matplotlib yfinance tabulate --quiet
      - name: Run preregistered GDELT multi-market study
        id: market_study
        continue-on-error: true
        env:
          MPLBACKEND: Agg
          MARKET_RESEARCH_OUTPUT: market_research_output
        run: |
          mkdir -p market_research_output
          set +e
          python research/global_news_markets/run_stage1_rate_limited.py > market_research_output/run.log 2>&1
          status=$?
          echo "$status" > market_research_output/exit_code.txt
          cat market_research_output/run.log
          exit 0
      - name: Upload market study reproducibility bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-news-markets-stage1
          path: market_research_output/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce market study success
        if: always()
        run: |
          test -f market_research_output/exit_code.txt
          test "$(cat market_research_output/exit_code.txt)" = "0"
          test -s market_research_output/manifest.json
          test -s market_research_output/hypothesis_results.csv
          test -s market_research_output/stage1_report.md

  india-fx-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install replication dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e . pandas statsmodels matplotlib tabulate huggingface_hub --quiet
      - name: Run preregistered GDELT USDINR replication
        id: replication
        continue-on-error: true
        env:
          MPLBACKEND: Agg
          INDIA_FX_OUTPUT: india_fx_output
        run: |
          mkdir -p india_fx_output
          set +e
          python research/global_news_markets/run_india_fx_replication_v2.py > india_fx_output/run.log 2>&1
          status=$?
          echo "$status" > india_fx_output/exit_code.txt
          cat india_fx_output/run.log
          exit 0
      - name: Upload USDINR replication bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-usdinr-external-replication
          path: india_fx_output/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce replication success
        if: always()
        run: |
          test -f india_fx_output/exit_code.txt
          test "$(cat india_fx_output/exit_code.txt)" = "0"
          test -s india_fx_output/manifest.json
          test -s india_fx_output/india_fx_results.csv
          test -s india_fx_output/india_fx_replication_report.md
