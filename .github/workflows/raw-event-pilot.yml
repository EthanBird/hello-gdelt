name: GDELT Raw Event Pilot

on:
  push:
    branches: ["research/**"]
    paths:
      - "research/global_news_markets/run_raw_event_pilot.py"
      - "research/global_news_markets/run_raw_event_pilot_v2.py"
      - "research/global_news_markets/raw_event_pilot_protocol.md"
      - ".github/workflows/raw-event-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-event-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pilot dependencies
        run: python -m pip install pandas pyarrow --quiet
      - name: Download, verify and aggregate 14 GDELT event days
        id: pilot
        continue-on-error: true
        env:
          RAW_EVENT_OUTPUT: raw_event_output
        run: |
          mkdir -p raw_event_output
          set +e
          python research/global_news_markets/run_raw_event_pilot_v2.py \
            --start 2025-07-18 --end 2025-07-31 \
            --output raw_event_output > raw_event_output/run.log 2>&1
          status=$?
          echo "$status" > raw_event_output/exit_code.txt
          cat raw_event_output/run.log
          exit 0
      - name: Upload raw pilot bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-daily-event-raw-pilot
          path: raw_event_output/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce pilot success
        if: always()
        run: |
          test -f raw_event_output/exit_code.txt
          test "$(cat raw_event_output/exit_code.txt)" = "0"
          test -s raw_event_output/manifest.json
          test -s raw_event_output/global_day_state.parquet
          test -s raw_event_output/country_day_state.parquet
          test -s raw_event_output/bilateral_day_relation.parquet
