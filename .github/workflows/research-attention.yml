name: Research - GDELT Wikipedia Attention

on:
  workflow_dispatch:
  push:
    branches: ["agent/hypothesis-lab-v1"]
    paths:
      - "research/gdelt_wikipedia_attention/**"
      - ".github/workflows/research-attention.yml"
      - "src/hello_gdelt/hypothesis/statistics.py"

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . matplotlib
      - name: Run preregistered study
        env:
          MPLBACKEND: Agg
          RESEARCH_OUTPUT: research_output
        run: python research/gdelt_wikipedia_attention/run_study.py
      - name: Show machine-readable decision
        run: python -m json.tool research_output/results.json | head -n 160
      - name: Upload reproducibility bundle
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-wikipedia-attention-study
          path: research_output/
          if-no-files-found: error
          retention-days: 30
