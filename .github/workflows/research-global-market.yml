name: Research - GDELT Global Market Pilot

on:
  workflow_dispatch:
  push:
    branches: ["agent/global-market-study-v1"]
    paths:
      - "research/global_market_pilot/**"
      - "configs/research/**"
      - "src/hello_gdelt/hypothesis/statistics.py"
      - ".github/workflows/research-global-market.yml"
  pull_request:
    paths:
      - "research/global_market_pilot/**"
      - "configs/research/**"
      - "src/hello_gdelt/hypothesis/statistics.py"
      - ".github/workflows/research-global-market.yml"

concurrency:
  group: gdelt-global-market-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  global-market-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e . pandas statsmodels matplotlib yfinance requests --quiet
      - name: Run preregistered pilot
        env:
          MPLBACKEND: Agg
          RESEARCH_OUTPUT: research_output_global_market
        run: python research/global_market_pilot/run_pilot_fast.py
      - name: Show summary
        run: |
          python -m json.tool research_output_global_market/summary.json
          sed -n '1,240p' research_output_global_market/pilot_report_cn.md
      - name: Enforce reproducibility outputs
        run: |
          test -s research_output_global_market/source_audit.json
          test -s research_output_global_market/market_prices.csv
          test -s research_output_global_market/gdelt_factors.csv
          test -s research_output_global_market/analysis_panel.csv
          test -s research_output_global_market/result_registry.csv
          test -s research_output_global_market/summary.json
          test -s research_output_global_market/pilot_report_cn.md
          test -s research_output_global_market/fig01_asset_coverage.png
          test -s research_output_global_market/fig02_gdelt_factor_shocks.png
      - name: Upload reproducibility bundle
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-global-market-pilot
          path: research_output_global_market/
          if-no-files-found: error
          retention-days: 30
