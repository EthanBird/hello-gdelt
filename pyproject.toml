[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hello-gdelt"
version = "0.1.0"
description = "Local-first GDELT computable-world research system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "EthanBird" }]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
hello-gdelt = "hello_gdelt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_gdelt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
"src/hello_gdelt/hypothesis/catalog.py" = ["E501"]
"src/hello_gdelt/hypothesis/runner.py" = ["UP035"]
"src/hello_gdelt/hypothesis/schema.py" = ["E501"]
"src/hello_gdelt/markets/calendars.py" = ["E501", "UP035"]

[tool.mypy]
python_version = "3.11"
strict = true
allow_redefinition = true
packages = ["hello_gdelt"]
