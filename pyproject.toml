[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hello-gdelt"
version = "0.1.0"
description = "Local-first GDELT observed-world and multi-market research laboratory"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
data = [
  "duckdb>=1.2,<2",
  "polars>=1.20,<2",
  "pyarrow>=18,<22",
]
research = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.9,<4",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]
all = ["hello-gdelt[data,research,dev]"]

[project.scripts]
hello-gdelt = "hello_gdelt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_gdelt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hello_gdelt"]
